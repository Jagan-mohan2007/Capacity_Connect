<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacity Connect — Trainer Login</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #fff; display: flex; align-items: center; justify-content: center;
}
canvas#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

.card {
  position: relative; z-index: 10; width: 400px; padding: 2.5rem 2rem;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(0,212,187,0.3);
  border-radius: 18px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 0 60px rgba(0,212,187,0.12), 0 20px 60px rgba(0,0,0,0.6);
}
.brand  { font-size: 0.62rem; letter-spacing: 0.35em; text-transform: uppercase; color: rgba(255,255,255,0.28); text-align:center; margin-bottom: 0.4rem; }
h2      { font-size: 1.5rem; font-weight: 300; letter-spacing: 0.1em; color: #00d4bb; text-align:center; margin-bottom: 1.6rem; }

/* Status Banner */
.status { display:none; font-size: 0.82rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 1rem; line-height: 1.5; }
.status.info    { display:block; background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.75); }
.status.success { display:block; background: rgba(0,212,187,0.1);    border:1px solid rgba(0,212,187,0.35);  color: #00d4bb; }
.status.error   { display:block; background: rgba(255,80,80,0.1);    border:1px solid rgba(255,80,80,0.35);  color: #ff8080; }

input {
  width: 100%; padding: 12px 15px; margin-bottom: 0.85rem;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 9px; color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.3s;
}
input::placeholder { color: rgba(255,255,255,0.3); }
input:focus { border-color: #00d4bb; }

.btn-primary {
  width:100%; padding:12px; border:none; border-radius:9px;
  background: #00d4bb; color: #000; font-weight:700; font-size:0.9rem;
  letter-spacing:0.07em; cursor:pointer; transition: all 0.25s; margin-top:0.2rem;
}
.btn-primary:hover:not(:disabled) { filter:brightness(1.15); transform:translateY(-1px); }
.btn-primary:disabled { opacity:0.55; cursor:not-allowed; transform:none; }

.row-link { display:flex; justify-content:flex-end; margin-top:0.6rem; }
.link-btn {
  background:none; border:none; color:rgba(255,255,255,0.38); font-size:0.78rem;
  cursor:pointer; transition:color 0.25s; padding:0;
}
.link-btn:hover { color:#fff; }

.divider { margin:1.4rem 0; display:flex; align-items:center; color:rgba(255,255,255,0.2); font-size:0.75rem; }
.divider::before,.divider::after { content:""; flex:1; border-bottom:1px solid rgba(255,255,255,0.08); }
.divider span { padding:0 10px; }

.btn-google {
  width:100%; padding:11px; border:1px solid rgba(255,255,255,0.15); border-radius:9px;
  background:#fff; color:#333; display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:0.88rem; font-weight:500; cursor:pointer; transition: all 0.25s;
}
.btn-google:hover:not(:disabled) { background:#f0f0f0; transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,0,0,0.35); }
.btn-google:disabled { opacity:0.55; cursor:not-allowed; transform:none; }

/* Forgot Password panel (hidden by default) */
.forgot-panel { display:none; margin-top:1.2rem; padding:1rem; background:rgba(255,255,255,0.04); border-radius:10px; border:1px solid rgba(255,255,255,0.08); }
.forgot-panel.open { display:block; }
.forgot-panel p { font-size:0.8rem; color:rgba(255,255,255,0.5); margin-bottom:0.8rem; }
.forgot-panel .btn-reset {
  width:100%; padding:10px; border:1px solid rgba(0,212,187,0.4); border-radius:8px;
  background:transparent; color:#00d4bb; font-size:0.85rem; cursor:pointer; transition: all 0.25s;
}
.forgot-panel .btn-reset:hover:not(:disabled) { background:rgba(0,212,187,0.1); }
.forgot-panel .btn-reset:disabled { opacity:0.5; cursor:not-allowed; }

.back-link { display:block; margin-top:1.5rem; font-size:0.7rem; color:rgba(255,255,255,0.22); text-align:center; text-decoration:none; letter-spacing:0.1em; transition:color 0.25s; }
.back-link:hover { color:#00d4bb; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="card">
  <p class="brand">Capacity Connect</p>
  <h2>Trainer Login</h2>

  <div id="status" class="status"></div>

  <!-- Sign In Form -->
  <div id="signin-form">
    <input type="email" id="email" placeholder="Email Address" />
    <input type="password" id="password" placeholder="Password" />
    <button class="btn-primary" id="btnSignIn" onclick="handleSignIn()">Sign In</button>

    <div class="row-link">
      <button class="link-btn" onclick="toggleForgot()">Forgot Password?</button>
    </div>

    <!-- Forgot Password inline panel -->
    <div class="forgot-panel" id="forgot-panel">
      <p>Enter your email above, then click the button below. We'll send a reset link instantly.</p>
      <button class="btn-reset" id="btnReset" onclick="handleForgotPassword()">Send Password Reset Email</button>
    </div>

    <div class="divider"><span>OR</span></div>

    <button class="btn-google" id="btnGoogle" onclick="handleGoogleLogin()">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
  </div>

  <a class="back-link" href="index.html">&#8592; Back to Home</a>
</div>

<!-- Firebase from Google CDN — no npm/bundler needed -->
<script type="module">
  import { initializeApp }        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup,
           signInWithEmailAndPassword, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ── YOUR FIREBASE CONFIG ─────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyAHxqeA-hTj4A0oaN_-i0a7iwPFDH-leT0",
    authDomain:        "capacity-connect-cecd2.firebaseapp.com",
    projectId:         "capacity-connect-cecd2",
    storageBucket:     "capacity-connect-cecd2.appspot.com",
    messagingSenderId: "346204390770",
    appId:             "1:346204390770:web:0b3f76632c1a7c53ee89eb"
  };
  // ────────────────────────────────────────────────────────────────────────

  const app            = initializeApp(firebaseConfig);
  const auth           = getAuth(app);
  const googleProvider = new GoogleAuthProvider();
  console.log("✅ Firebase initialized — trainer-login");

  // ── Helpers ──────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function showStatus(msg, type = 'info') {
    const el = $('status');
    el.className = `status ${type}`;
    el.textContent = msg;
  }

  function setLoading(on) {
    ['btnSignIn','btnReset','btnGoogle'].forEach(id => {
      const el = $(id); if (el) el.disabled = on;
    });
  }

  // Sync logged-in user to your Node/SQLite backend.
  // If backend is offline we just warn — login still succeeds.
  async function syncBackend(user, role) {
    try {
      const res = await fetch('http://localhost:5000/api/auth/google', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          uid:      user.uid,
          email:    user.email,
          name:     user.displayName || user.email,
          photoUrl: user.photoURL    || '',
          role
        })
      });
      const data = await res.json();
      console.log("✅ Backend sync:", data.message);
    } catch (err) {
      console.warn("⚠️ Backend offline — skipping DB sync:", err.message);
    }
  }

  // ── Google Sign-In ───────────────────────────────────────────────────────
  window.handleGoogleLogin = async () => {
    console.log("🔵 Google sign-in started");
    setLoading(true);
    showStatus("Opening Google Sign-In popup…", "info");
    try {
      const result = await signInWithPopup(auth, googleProvider);
      console.log("✅ Google sign-in success:", result.user.email);
      showStatus(`Signed in as ${result.user.email}. Saving to database…`, "success");
      await syncBackend(result.user, 'trainer');
      showStatus("Login successful! Redirecting to dashboard…", "success");
      setTimeout(() => { window.location.href = 'trainer-dashboard.html'; }, 1400);
    } catch (err) {
      console.error("❌ Google sign-in error:", err.code, err.message);

      // Give a human-readable explanation for the most common errors
      let msg = err.message;
      if (err.code === 'auth/popup-blocked')
        msg = "Popup was blocked by your browser. Please allow popups for this site and try again.";
      else if (err.code === 'auth/unauthorized-domain')
        msg = "This domain is not authorized in Firebase. Go to Firebase Console → Authentication → Settings → Authorized Domains and add 'localhost'.";
      else if (err.code === 'auth/invalid-api-key')
        msg = "Invalid Firebase API key. Please double-check your config.";
      else if (err.code === 'auth/popup-closed-by-user')
        msg = "Sign-in popup was closed before completing. Please try again.";

      showStatus("Google sign-in failed: " + msg, "error");
    } finally { setLoading(false); }
  };

  // ── Email / Password Sign-In ─────────────────────────────────────────────
  window.handleSignIn = async () => {
    const email    = $('email').value.trim();
    const password = $('password').value;
    if (!email || !password) { showStatus("Please enter your email and password.", "error"); return; }
    setLoading(true);
    showStatus("Signing in…", "info");
    try {
      const result = await signInWithEmailAndPassword(auth, email, password);
      showStatus("Login successful! Redirecting…", "success");
      setTimeout(() => { window.location.href = 'trainer-dashboard.html'; }, 1200);
    } catch (err) {
      console.error("❌ Email sign-in error:", err.code, err.message);
      showStatus("Sign-in failed: " + err.message, "error");
    } finally { setLoading(false); }
  };

  // ── Forgot Password ──────────────────────────────────────────────────────
  window.toggleForgot = () => {
    const panel = $('forgot-panel');
    panel.classList.toggle('open');
  };

  window.handleForgotPassword = async () => {
    const email = $('email').value.trim();
    if (!email) {
      showStatus("Type your email address in the Email field above, then click 'Send Password Reset Email'.", "error");
      return;
    }
    setLoading(true);
    showStatus("Sending reset email…", "info");
    try {
      await sendPasswordResetEmail(auth, email);
      console.log("✅ Password reset email sent to:", email);
      showStatus("Reset email sent to " + email + "! Check your inbox (and spam folder).", "success");
    } catch (err) {
      console.error("❌ Forgot password error:", err.code, err.message);
      showStatus("Could not send reset email: " + err.message, "error");
    } finally { setLoading(false); }
  };
</script>

<!-- Animated starfield -->
<script>
  const cvs = document.getElementById('bg'), ctx = cvs.getContext('2d');
  let W, H, stars = [];
  const resize = () => {
    W = cvs.width = innerWidth; H = cvs.height = innerHeight;
    stars = Array.from({length: Math.floor(W*H/2600)}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.1+0.2, a: Math.random(),
      da: (Math.random()-0.5)*0.004, spd: Math.random()*0.04+0.006
    }));
  };
  window.addEventListener('resize', resize); resize();
  (function tick() {
    ctx.clearRect(0,0,W,H);
    for (const s of stars) {
      s.a += s.da; if (s.a<=0||s.a>=1) s.da*=-1;
      s.y -= s.spd; if (s.y<-2) { s.y=H+2; s.x=Math.random()*W; }
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${s.a*0.6})`; ctx.fill();
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
